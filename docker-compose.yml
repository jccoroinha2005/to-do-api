services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: to_do_api_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: to_do_api_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U to_do_api_user -d to_do_api_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5433:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://to_do_api_user:${DB_PASSWORD}@db:5432/to_do_api_db
    ports:
      - "8080:8080"

volumes:
  pgdata: